<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQUILIBRIUM — directing you</title>
    <!-- Keep the url= target, the #go link, and the noscript link in sync with
         DEFAULT_VERSION below whenever you bump the declared stable build. -->
    <meta http-equiv="refresh" content="30; url=https://aigsniperyt.github.io/equilibrium-v6/">
    <meta name="theme-color" content="#090705">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23090705'/><text x='50' y='80' text-anchor='middle' font-size='70' fill='%23ffd98a'>&#9674;</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Georgia, 'Times New Roman', serif;
            color: #fff3d6;
            background: #090705;
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
            isolation: isolate;
        }

        /* the boot splash backdrop: same layered glow as the in-game launch */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(20px, 4.5vh, 38px);
            padding: 24px;
            text-align: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 44%, rgba(255, 228, 170, 0.09), transparent 27%),
                radial-gradient(circle at 16% 12%, rgba(255, 183, 89, 0.06), transparent 24%),
                radial-gradient(circle at 84% 84%, rgba(255, 238, 198, 0.045), transparent 26%),
                linear-gradient(180deg, #1a120b 0%, #0c0a07 48%, #070504 100%);
        }

        /* halo ring, flush centre — as in the splash */
        #splash::before {
            content: "";
            position: absolute;
            z-index: -1;
            width: min(76vw, 840px);
            aspect-ratio: 1;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -54%);
            border: 1px solid rgba(255, 224, 164, 0.16);
            border-radius: 50%;
            box-shadow:
                inset 0 0 70px rgba(255, 222, 160, 0.045),
                0 0 92px rgba(255, 190, 94, 0.07);
            animation: halo-breathe 7s ease-in-out infinite;
        }

        /* faint screen-blend grid, splashed over everything */
        #splash::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(rgba(255, 242, 214, 0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 242, 214, 0.013) 1px, transparent 1px);
            background-size: 3px 3px, 5px 5px;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        /* title, splice of gold-washed gradient + faint stroke — splash exact */
        .splash-title {
            max-width: calc(100vw - 36px);
            font-family: Cinzel, 'Palatino Linotype', 'Book Antiqua', Georgia, 'Times New Roman', serif;
            font-size: clamp(36px, 7.5vw, 82px);
            font-variant: small-caps;
            font-weight: 700;
            letter-spacing: 0.24em;
            text-indent: 0.24em;
            line-height: 0.95;
            color: #fff4d4;
            background: linear-gradient(180deg, #fff9e6 0%, #ffe7a7 31%, #d79541 53%, #fff0bf 77%, #f5bd67 100%);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow:
                0 1px 0 rgba(77, 42, 10, 0.86),
                0 0 12px rgba(255, 244, 200, 0.78),
                0 0 34px rgba(255, 203, 118, 0.42),
                0 0 82px rgba(255, 179, 74, 0.2);
        }

        .s-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            width: min(460px, 76vw);
            color: rgba(255, 231, 172, 0.94);
            font-size: 13px;
            line-height: 1;
            text-shadow:
                0 0 9px rgba(255, 232, 174, 0.72),
                0 0 24px rgba(255, 179, 72, 0.26);
        }
        .s-ornament::before,
        .s-ornament::after {
            content: "";
            display: block;
            flex: 1;
            height: 1px;
            box-shadow: 0 0 10px rgba(255, 218, 150, 0.34);
        }
        .s-ornament::before { background: linear-gradient(90deg, transparent, rgba(255, 218, 150, 0.28), rgba(255, 243, 202, 0.86)); }
        .s-ornament::after  { background: linear-gradient(90deg, rgba(255, 243, 202, 0.86), rgba(255, 218, 150, 0.28), transparent); }

        .s-tagline {
            font-family: 'Palatino Linotype', 'Book Antiqua', Georgia, 'Times New Roman', serif;
            font-size: clamp(14px, 2.2vw, 18px);
            font-style: italic;
            letter-spacing: 0.12em;
            color: rgba(255, 239, 203, 0.9);
            text-shadow:
                0 0 10px rgba(255, 231, 174, 0.45),
                0 0 30px rgba(255, 176, 78, 0.18);
        }

        /* raised motes — same material as splash-mote */
        .mote {
            position: absolute;
            z-index: 0;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(255, 248, 220, 0.96),
                rgba(255, 205, 120, 0.52) 55%,
                rgba(255, 180, 90, 0) 75%
            );
            box-shadow: 0 0 8px 2px rgba(255, 210, 140, 0.5);
            pointer-events: none;
            animation: mote-rise ease-in-out infinite;
        }

        /* loading line — a soul-essence fill, not a countdown */
        .loader {
            position: relative;
            z-index: 1;
            width: min(430px, calc(100vw - 44px));
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
        }
        .loader-rail {
            position: relative;
            height: 3px;
            background: linear-gradient(90deg, rgba(255, 250, 244, 0.06), rgba(255, 250, 244, 0.16));
            box-shadow:
                inset 0 0 6px rgba(255, 250, 244, 0.18),
                0 0 10px rgba(255, 226, 150, 0.10);
        }
        .loader-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(255, 240, 200, 0.6), #ffe9b8, #ffd98a);
            box-shadow:
                0 0 10px rgba(255, 217, 138, 0.85),
                0 0 26px rgba(255, 203, 118, 0.45);
            transition: width 0.9s ease-out;
        }
        /* shimmer travelling down the loaded length */
        .loader-fill::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 252, 244, 0.85), transparent);
            background-size: 60% 100%;
            background-repeat: no-repeat;
            animation: loader-sheen 1.8s linear infinite;
        }
        .loader-msg {
            font-size: 13px;
            letter-spacing: 0.14em;
            color: rgba(255, 244, 214, 0.78);
            text-shadow: 0 0 10px rgba(255, 226, 150, 0.35);
            font-style: italic;
            min-height: 1.4em;
            transition: opacity 0.3s ease;
        }
        .loader-pct {
            font-family: Consolas, 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 0.22em;
            color: rgba(255, 240, 210, 0.4);
        }
        .loader-pct b {
            color: rgba(255, 233, 184, 0.7);
            font-weight: 700;
            margin-right: 0.6em;
            border-right: 1px solid rgba(255, 233, 184, 0.18);
            padding-right: 0.6em;
        }

        /* quiet skip link, styled like the in-game changelog link */
        .skip {
            position: relative;
            z-index: 1;
            font-size: 12px;
            font-style: italic;
            letter-spacing: 0.1em;
            color: rgba(232, 212, 138, 0.55);
            text-decoration: none;
            border-bottom: 1px solid rgba(232, 212, 138, 0.3);
            padding-bottom: 1px;
            transition: color .25s ease, text-shadow .25s ease;
        }
        .skip:hover {
            color: #fff8ee;
            text-shadow: 0 0 10px rgba(232, 212, 138, 0.5);
        }

        /* footer credit — echo of the launch credit line */
        .credit {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 14px;
            z-index: 1;
            text-align: center;
            font-size: 12px;
            font-style: italic;
            letter-spacing: 0.12em;
            color: rgba(255, 239, 203, 0.28);
            text-shadow: 0 0 10px rgba(255, 231, 174, 0.18);
        }

        @keyframes halo-breathe {
            0%, 100% { transform: translate(-50%, -54%) scale(1); opacity: 0.8; }
            50%      { transform: translate(-50%, -54%) scale(1.04); opacity: 1; }
        }
        @keyframes mote-rise {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            24%  { opacity: 0.85; }
            48%  { transform: translateY(-14vh) translateX(var(--curl, 18px)); opacity: 0.75; }
            100% { transform: translateY(-30vh) translateX(var(--drift, 16px)); opacity: 0; }
        }
        @keyframes loader-sheen {
            0%   { background-position: -60% 0; }
            100% { background-position: 160% 0; }
        }

        noscript { display: block; padding: 12px; font-size: 13px; }

        @media (max-width: 560px) {
            #splash { gap: 20px; padding: 18px; }
            .splash-title { font-size: clamp(30px, 12vw, 48px); letter-spacing: 0.14em; text-indent: 0.14em; }
        }
    </style>
</head>
<body>
    <div id="splash">
        <h1 class="splash-title" id="title">EQUILIBRIUM</h1>
        <div class="s-ornament">&#9674;</div>
        <p class="s-tagline">light condensed from darkness &mdash; directing you to the newest build</p>

        <section class="loader">
            <div class="loader-rail"><div class="loader-fill" id="fill"></div></div>
            <p class="loader-msg" id="msg">soul settling into density</p>
            <p class="loader-pct"><b class="ver" id="ver">v6</b><span id="pct">0&thinsp;%</span></p>
        </section>

        <a class="skip" id="go" href="https://aigsniperyt.github.io/equilibrium-v6/">or step through now</a>

        <noscript>
            <p style="color:rgba(255,239,203,.7);font-style:italic">Javascript is needed for the loading &mdash;
            <a href="https://aigsniperyt.github.io/equilibrium-v6/" style="color:#ffe9b8">step through directly</a>.</p>
        </noscript>
    </div>

    <footer class="credit">made with care &middot; by AIGsniper</footer>

    <script>
        const BASE = "https://aigsniperyt.github.io/equilibrium-v";
        // Declared stable build — the only gate on stability. Bump this per
        // stable release (e.g. "6" now, "7.4" once 7.x is stable). The probe
        // explores minors WITHIN this build's major only, so an unstable next
        // major (like the current v7.0) is never auto-linked.
        const DEFAULT_VERSION = "6";
        const MINOR_CEILING = 9; // probe equilibrium-v{M}.0 .. .9 plus bare equilibrium-v{M}
        const DURATION = 3000; // ms before stepping through
        const el = {
            go: document.getElementById("go"),
            fill: document.getElementById("fill"),
            pct: document.getElementById("pct"),
            msg: document.getElementById("msg"),
            ver: document.getElementById("ver")
        };

        function setTarget(v) {
            const u = BASE + v + "/";
            el.go.href = u;
            el.ver.textContent = "v" + v;
        }

        function parseVersion(v) {
            const [maj, min] = String(v).split(".").map(n => parseInt(n, 10));
            return { maj, min: Number.isFinite(min) ? min : 0 };
        }
        // Numeric ordering so "7.4" beats "7.0" beats "6" — bare majors sort as .0.
        function versionKey(v) {
            const { maj, min } = parseVersion(v);
            return maj * 100 + min;
        }

        // organic ease-in-out fill, not a ticking clock
        const LINES = [
            "entropy never stops so neither can you",
            "keep your patience when suffering asks for it",
            "only one of you remembers the wrong turn",
            "white is what the storm settles into",
            "lily maru cuts neither too much nor too little",
            "matter is condensed soul given lasting form",
            "holding balance is harder than finding it",
            "soul condenses where density is made",
            "light settles where soul grows dense",
            "a wrong turn remembered need not be repeated",
            "the end can be refused quietly",
            "what is held together can still be moving",
            "the void is felt where soul grows sparse",
            "form follows the soul that holds it",
            "some wounds heal before they are forgotten",
            "patience is easier to keep than to recover",
            "equilibrium is kept not found",
            "condensing soul into density",
            "reversing entropy",
            "settling light into form",
            "holding soul and void in balance",
            "remembering what the soul already survived",
            "the second chance remembers what you cannot undo",
            "too much breaks what too little cannot hold",
            "a steady hand leaves room for balance",
            "the soul holds what the body cannot",
            "what survives the storm need not remain dark"
        ];

        const pool = LINES.slice();
        function popNext() {
            if (!pool.length) pool.push.apply(pool, LINES);
            const i = Math.floor(Math.random() * pool.length);
            return pool.splice(i, 1)[0];
        }
        const msgEl = el.msg;
        msgEl.style.opacity = "0";
        setTimeout(() => {
            msgEl.textContent = popNext();
            msgEl.style.opacity = "1";
        }, 300);

        function run() {
            const fillEl = el.fill;
            const pctEl = el.pct;
            const t0 = performance.now();
            (function step(now) {
                const t = Math.min(1, (now - t0) / DURATION);
                const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                fillEl.style.width = (eased * 100) + "%";
                pctEl.textContent = Math.round(eased * 100) + "%";
                if (t < 1) {
                    requestAnimationFrame(step);
                } else {
                    location.replace(el.go.href);
                }
            })(t0);
        }

        if (window.fetch) {
            // Probe only the declared major's minors (e.g. "7" -> v7, 7.0..7.9).
            const { maj } = parseVersion(DEFAULT_VERSION);
            const candidates = [String(maj)];
            for (let n = 0; n <= MINOR_CEILING; n++) candidates.push(maj + "." + n);
            const queue = candidates.map(v =>
                fetch(BASE + v + "/", { method: "HEAD", cache: "no-store" })
                    .then(r => (r.ok || r.status === 0) ? v : null)
                    .catch(() => null)
            );
            Promise.all(queue).then(results => {
                const found = results.filter(Boolean).sort((a, b) => versionKey(b) - versionKey(a));
                setTarget(found.length ? found[0] : DEFAULT_VERSION);
                run();
            }).catch(() => { setTarget(DEFAULT_VERSION); run(); });
        } else {
            setTarget(DEFAULT_VERSION);
            run();
        }

        // spawn drifting motes the way the boot splash does
        const splash = document.getElementById("splash");
        for (let i = 0; i < 20; i++) {
            const mote = document.createElement("span");
            mote.className = "mote";
            const size = 3 + Math.random() * 5;
            const curl = -28 + Math.random() * 56;
            const drift = -18 + Math.random() * 36;
            mote.style.width = size + "px";
            mote.style.height = size + "px";
            mote.style.setProperty("--curl", curl + "px");
            mote.style.setProperty("--drift", drift + "px");
            mote.style.left = (2 + Math.random() * 96) + "%";
            mote.style.top = (18 + Math.random() * 64) + "%";
            mote.style.animationDuration = (4.4 + Math.random() * 1.6) + "s";
            mote.style.animationDelay = (Math.random() * 5) + "s";
            splash.appendChild(mote);
        }
    </script>
</body>
</html>
